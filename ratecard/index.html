      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3a1 1 0 0 1 1 1v9.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1Zm-7 14a1 1 0 0 1 1 1v1h12v-1a1 1 0 1 1 2 0v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z"/></svg>

  <main class="container rc-container">
    <div id="sections"></div>

<div class="viewer" id="viewer" aria-hidden="true">
  <button class="viewer-back-float" type="button" data-close aria-label="返回">
    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20v-2Z"/></svg>
    返回
  </button>
  <div class="viewer-backdrop" data-close></div>
  <div class="viewer-panel">
    <div class="viewer-head">
      <div class="viewer-title">
        <span class="viewer-cat" id="viewerCat"></span>
        <h3 id="viewerName"></h3>
      </div>
      <div class="viewer-tools">
        <div class="viewer-zoom">
          <button class="btn btn-ghost2 btn-sm" id="zoomOut" type="button" aria-label="缩小">−</button>
          <span class="zoom-pct" id="zoomPct">100%</span>
          <button class="btn btn-ghost2 btn-sm" id="zoomIn" type="button" aria-label="放大">＋</button>

    </div>
    <div class="viewer-frame" id="viewerFrame">
      <div class="pdf-pages" id="pdfPages"></div>

  </div>

<div class="gate" id="gate">

      <button class="btn btn-ghost2" id="btnHaveCode" type="button">已获取访问码</button>
    </div>
    <div class="gate-code" id="gateCode" hidden>
      <input class="gate-input" type="text" id="codeInput" placeholder="请输入访问码" autocomplete="off" />
      <button class="btn btn-primary" id="btnVerify" type="button">确认</button>

  </div>
