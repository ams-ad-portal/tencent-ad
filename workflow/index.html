<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>腾讯内容平台 · 常用流程</title>
<meta name="description" content="腾讯内容平台常用流程页，按账户类流程、执行类流程、业务审批类流程分类展示。" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f5f7fb;
    --card: #ffffff;
    --text: #1a1a2e;
    --sub: #667085;
    --line: #e6ecf5;
    --primary: #006eff;
    --primary-2: #0046c0;
    --soft: rgba(0, 110, 255, 0.08);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .hero {
    background: linear-gradient(120deg, var(--primary-2) 0%, var(--primary) 60%, #2a8bff 100%);
    color: #fff;
    padding: 52px 20px 72px;
  }
  .hero-inner,
  .main,
  .foot {
    width: min(1120px, calc(100% - 32px));
    margin: 0 auto;
  }
  .topbar {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.14);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
  }
  .hero h1 {
    margin-top: 18px;
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .hero p {
    margin-top: 12px;
    max-width: 760px;
    line-height: 1.8;
    color: rgba(255,255,255,0.84);
    font-size: 14px;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
    margin-top: 24px;
  }
  .tab-card {
    border: 2px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 18px 18px 16px;
    backdrop-filter: blur(8px);
    color: #fff;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
  }
  .tab-card:hover {
    background: rgba(255,255,255,0.18);
    transform: translateY(-2px);
  }
  .tab-card.active {
    background: #ffffff;
    border-color: #ffffff;
    color: var(--primary-2);
    box-shadow: 0 14px 30px rgba(0, 28, 80, 0.22);
  }
  .tab-card .kicker {
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.82;
  }
  .tab-card strong {
    display: block;
    margin-top: 8px;
    font-size: 20px;
  }
  .tab-card span {
    display: block;
    margin-top: 6px;
    font-size: 13px;
    line-height: 1.7;
    color: rgba(255,255,255,0.82);
  }
  .tab-card.active span { color: var(--sub); }
  .main {
    margin-top: -34px;
    padding-bottom: 44px;
  }
  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    overflow: hidden;
  }
  .panel-head {
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(0,110,255,0.05) 0%, rgba(0,110,255,0.01) 100%);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }
  .panel-head h2 {
    font-size: 22px;
    font-weight: 800;
  }
  .panel-head p {
    margin-top: 8px;
    color: var(--sub);
    font-size: 14px;
    line-height: 1.7;
  }
  .badge {
    white-space: nowrap;
    padding: 7px 12px;
    border-radius: 999px;
    background: #eff6ff;
    color: var(--primary-2);
    font-size: 12px;
    font-weight: 700;
  }
  .name-list {
    list-style: none;
    padding: 12px 22px 22px;
  }
  .name-row { border-bottom: 1px solid var(--line); }
  .name-row:last-child { border-bottom: none; }
  .name-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-align: left;
  }
  .name-btn:hover { color: var(--primary); }
  .name-btn .arrow {
    font-size: 13px;
    color: var(--sub);
    transition: transform 0.18s ease;
  }
  .name-row.open .name-btn { color: var(--primary); }
  .name-row.open .name-btn .arrow { transform: rotate(90deg); }
  .detail {
    display: none;
    padding: 0 6px 18px;
  }
  .name-row.open .detail { display: block; }
  .detail-box {
    border: 1px solid #d7e5fb;
    border-radius: 16px;
    background: linear-gradient(180deg, #fbfdff 0%, #f4f8ff 100%);
    padding: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
  }
  .detail-box p {
    color: var(--sub);
    font-size: 13px;
    line-height: 1.8;
  }
  .flow-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .flow-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 96px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 10px 20px rgba(0, 110, 255, 0.14);
  }
  .flow-btn-secondary {
    background: #eaf2ff;
    color: var(--primary-2);
    box-shadow: none;
  }
  .empty {
    padding: 26px 22px 30px;
    color: var(--sub);
    font-size: 14px;
    line-height: 1.8;
  }
  .foot {
    padding: 0 0 28px;
    text-align: center;
    color: #98a2b3;
    font-size: 12px;
  }
  @media (max-width: 900px) {
    .tabs { grid-template-columns: 1fr; }
  }
  @media (max-width: 767px) {
    .hero { padding: 36px 16px 56px; }
    .hero-inner, .main, .foot { width: min(100% - 24px, 1120px); }
    .hero h1 { font-size: 26px; }
    .panel-head { padding: 18px; flex-direction: column; }
    .name-list { padding: 8px 16px 18px; }
    .detail-box { flex-direction: column; align-items: flex-start; }
    .flow-actions { width: 100%; justify-content: flex-start; }
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <a class="topbar" href="../">← 返回资源门户</a>
      <h1>常用流程</h1>
      <p>点击上方分区，下方只显示该分区收录的流程名称；再点流程名称，展开详情与下载入口。</p>
      <div class="tabs" id="tabs"></div>
    </div>
  </header>

  <main class="main">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 id="panel-title"></h2>
          <p id="panel-desc"></p>
        </div>
        <span class="badge" id="panel-badge"></span>
      </div>
      <div id="panel-body"></div>
    </section>
  </main>

  <footer class="foot">腾讯内容平台 · 常用流程 · © 2026</footer>

<script>
  const SECTIONS = [
    {
      id: "account",
      kicker: "01",
      title: "账户类流程",
      summary: "账号申请、开通、权限配置、密码重置等内容。",
      desc: "适合放账号开通、账号绑定、权限申请、权限变更、密码与安全设置相关流程。",
      flows: [
        {
          name: "【腾讯ADQ开户流程】",
          desc: "客户版流程文档 · Word 文件 · 适用于账户开户相关查看与下载。",
          openUrl: "./previews/tencent-adq-kaihu-flow/",
          downloadUrl: "./docs/tencent-adq-kaihu-flow-customer.docx"
        }
      ]
    },
    {
      id: "execution",
      kicker: "02",
      title: "执行类流程",
      summary: "日常投放执行、素材处理、数据提取、提报操作等内容。",
      desc: "适合放执行动作、日常操作、物料提交、数据导出、排期更新等流程。",
      flows: []
    },
    {
      id: "approval",
      kicker: "03",
      title: "业务审批类流程",
      summary: "业务提审、盖章、合同、结算、特殊审批等内容。",
      desc: "适合放业务审批、合同审批、盖章、付款、结算、特殊申请等流程。",
      flows: []
    }
  ];

  const tabsEl = document.getElementById("tabs");
  const titleEl = document.getElementById("panel-title");
  const descEl = document.getElementById("panel-desc");
  const badgeEl = document.getElementById("panel-badge");
  const bodyEl = document.getElementById("panel-body");

  let currentId = SECTIONS[0].id;

  function renderTabs() {
    tabsEl.innerHTML = SECTIONS.map(function (s) {
      return '<button type="button" class="tab-card' + (s.id === currentId ? " active" : "") + '" data-id="' + s.id + '">' +
        '<div class="kicker">' + s.kicker + '</div>' +
        '<strong>' + s.title + '</strong>' +
        '<span>' + s.summary + '</span>' +
      '</button>';
    }).join("");
  }

  function renderPanel() {
    const s = SECTIONS.find(function (x) { return x.id === currentId; });
    titleEl.textContent = s.title;
    descEl.textContent = s.desc;
    badgeEl.textContent = s.flows.length ? (s.flows.length + " 条流程") : "待补内容";

    if (!s.flows.length) {
      bodyEl.innerHTML = '<div class="empty">这个分区还没有收录流程。你把内容发给我，我会直接补到这一类里。</div>';
      return;
    }

    bodyEl.innerHTML = '<ul class="name-list">' + s.flows.map(function (f, i) {
      return '<li class="name-row" data-index="' + i + '">' +
        '<button type="button" class="name-btn">' +
          '<span>' + f.name + '</span>' +
          '<span class="arrow">展开 ›</span>' +
        '</button>' +
        '<div class="detail">' +
          '<div class="detail-box">' +
            '<p>' + f.desc + '</p>' +
            '<div class="flow-actions">' +
              '<a class="flow-btn" href="' + f.openUrl + '" target="_blank" rel="noopener">打开文档</a>' +
              '<a class="flow-btn flow-btn-secondary" href="' + f.downloadUrl + '" download>下载文档</a>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</li>';
    }).join("") + '</ul>';
  }

  tabsEl.addEventListener("click", function (e) {
    const btn = e.target.closest(".tab-card");
    if (!btn) return;
    currentId = btn.getAttribute("data-id");
    renderTabs();
    renderPanel();
  });

  bodyEl.addEventListener("click", function (e) {
    const btn = e.target.closest(".name-btn");
    if (!btn) return;
    btn.closest(".name-row").classList.toggle("open");
  });

  renderTabs();
  renderPanel();
</script>
</body>
</html>
